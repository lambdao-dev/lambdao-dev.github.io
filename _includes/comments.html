{% if jekyll.environment == "production" %}
<script defer src="https://tell.lambdao.dev/comentario.js"></script>
<comentario-comments
  theme="dark"
  page-title="{{ page.title | escape }}"
></comentario-comments>
{% else %}
<div class="comments-placeholder" style="background: red;">
  Comments are enabled in production.
  Set <code>JEKYLL_ENV=production</code> to enable comments.
  The Comentario instance is not configured to allow localhost.
</div>
{% endif %}
