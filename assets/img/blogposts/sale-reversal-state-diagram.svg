<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" role="img" aria-labelledby="title description">
  <title id="title">Sale and reversal state diagram</title>
  <desc id="description">A sale moves from ordered to paid. Before shipment it can be cancelled and refunded. After shipment, reversal requires a return, inspection, and refund.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4d4d4d"/>
    </marker>
    <style>
      .state { fill: #fff; stroke: #3e0a71; stroke-width: 3; }
      .terminal { fill: #f8f7f3; stroke: #0b8772; stroke-width: 3; }
      .flow { fill: none; stroke: #4d4d4d; stroke-width: 2.5; marker-end: url(#arrow); }
      .label { font: 19px sans-serif; fill: #161616; text-anchor: middle; dominant-baseline: middle; }
      .edge { font: 15px sans-serif; fill: #4d4d4d; text-anchor: middle; }
      .edge-side { font: 15px sans-serif; fill: #4d4d4d; text-anchor: start; }
      .note { font: italic 15px sans-serif; fill: #4d4d4d; text-anchor: middle; }
    </style>
  </defs>

  <path class="flow" d="M 154 75 H 251"/>
  <path class="flow" d="M 389 75 H 486"/>
  <path class="flow" d="M 624 75 H 721"/>
  <path class="flow" d="M 320 110 V 239"/>
  <path class="flow" d="M 790 110 V 275 H 705"/>
  <path class="flow" d="M 566 275 H 390"/>

  <rect class="state" x="16" y="40" width="138" height="70" rx="12"/>
  <rect class="state" x="251" y="40" width="138" height="70" rx="12"/>
  <rect class="state" x="486" y="40" width="138" height="70" rx="12"/>
  <rect class="state" x="721" y="40" width="138" height="70" rx="12"/>
  <rect class="terminal" x="251" y="239" width="138" height="70" rx="35"/>
  <rect class="state" x="566" y="239" width="138" height="70" rx="12"/>

  <text class="label" x="85" y="75">Ordered</text>
  <text class="label" x="320" y="75">Paid</text>
  <text class="label" x="555" y="75">Shipped</text>
  <text class="label" x="790" y="75">Delivered</text>
  <text class="label" x="320" y="274">Refunded</text>
  <text class="label" x="635" y="274">Inspect</text>

  <text class="edge" x="202" y="61">charge</text>
  <text class="edge" x="437" y="61">ship</text>
  <text class="edge" x="672" y="61">deliver</text>
  <text class="edge-side" x="336" y="184">cancel + refund</text>
  <text class="edge-side" x="806" y="184">request return</text>
  <text class="edge" x="478" y="264">refund</text>
  <text class="note" x="460" y="329">A “reversal” means different transitions depending on the current state.</text>
</svg>
